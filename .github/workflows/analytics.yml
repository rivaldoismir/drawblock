name: Update visit counters

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visit-counters
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh counters
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic PAT with `repo` scope; the default GITHUB_TOKEN gets 403
          # from the Traffic API. Optional: repo badges show n/a without it.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/stats; then
            echo "No counter changes."
            exit 0
          fi
          git add docs/stats
          git commit -m "chore: update visit counters"
          # Works even when checkout is a detached HEAD.
          git push origin HEAD:main
