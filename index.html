<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6965db" />
    <meta
      name="description"
      content="DrawBlock — workspace offline untuk catatan Markdown dan gambar Excalidraw. File tetap di disk Anda."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DrawBlock — local-first notes & sketches" />
    <meta
      property="og:description"
      content="A private, offline-first workspace for Markdown notes and Excalidraw sketches. No account, no cloud, no lock-in."
    />
    <meta property="og:url" content="https://drawblock.vercel.app/" />
    <meta property="og:image" content="https://drawblock.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrawBlock — local-first notes & sketches" />
    <meta
      name="twitter:description"
      content="A private, offline-first workspace for Markdown notes and Excalidraw sketches."
    />
    <meta name="twitter:image" content="https://drawblock.vercel.app/og-image.png" />
    <title>DrawBlock</title>
    <script>
      // Default terang; terapkan pilihan gelap sebelum paint agar tidak berkedip.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("drawblock:theme") === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
      window.EXCALIDRAW_EXPORT_SOURCE = "drawblock";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
