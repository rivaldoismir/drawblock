<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DrawBlock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c78e8"/>
      <stop offset="1" stop-color="#5a56cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b2878" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="128" cy="96" r="190" fill="#ffffff" opacity="0.06"/>

  <!-- BlockNote: a clean note sheet -->
  <g transform="rotate(-7 228 250)" filter="url(#shadow)">
    <rect x="112" y="104" width="228" height="292" rx="30" fill="#ffffff"/>
    <rect x="154" y="166" width="146" height="20" rx="10" fill="#6965db"/>
    <rect x="154" y="212" width="112" height="15" rx="7.5" fill="#c3c1f4"/>
    <rect x="154" y="246" width="134" height="15" rx="7.5" fill="#c3c1f4"/>
    <rect x="154" y="280" width="88" height="15" rx="7.5" fill="#c3c1f4"/>
  </g>

  <!-- Excalidraw: a pencil caught mid-sketch -->
  <g transform="rotate(42 350 300)">
    <rect x="322" y="128" width="56" height="252" rx="12" fill="#ffd43b"/>
    <rect x="322" y="128" width="56" height="38" rx="12" fill="#ff8787"/>
    <path d="M322 380 L350 434 L378 380 Z" fill="#f1f3f5"/>
    <path d="M350 434 L338 407 L362 407 Z" fill="#212529"/>
    <rect x="322" y="128" width="56" height="252" rx="12" fill="none" stroke="#212529" stroke-width="6" opacity="0.8"/>
  </g>

  <!-- Hand-drawn stroke under the pencil tip -->
  <path d="M104 424c34-18 58-16 86-2 28 14 46 12 74-4 24-14 44-14 70-2"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
</svg>
